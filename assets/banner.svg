<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="BILAL-OS boot screen: Muhammad Bilal Khalid, AI Application Developer. Open to internships and freelance." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Muhammad Bilal Khalid - AI Application Developer</title>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .t1 { animation: type1 1.6s steps(40) 0.5s both; }
    .t2 { animation: type2 1.4s steps(21) 2.3s both; }
    .t3 { animation: type3 1.2s steps(24) 3.9s both; }
    .t4 { animation: type4 1.2s steps(37) 5.2s both; }
    .t5 { animation: type5 1.4s steps(42) 6.6s both; }
    .cursor { opacity: 0; animation: blink 1s steps(1) 8s infinite; }
    .glow { animation: flicker 4s steps(1) 8s infinite; }
    @keyframes type1 { from { width: 0; } to { width: 440px; } }
    @keyframes type2 { from { width: 0; } to { width: 520px; } }
    @keyframes type3 { from { width: 0; } to { width: 330px; } }
    @keyframes type4 { from { width: 0; } to { width: 410px; } }
    @keyframes type5 { from { width: 0; } to { width: 470px; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes flicker { 0% { opacity: 0.05; } 92% { opacity: 0.09; } 96% { opacity: 0.03; } }
    @media (prefers-reduced-motion: reduce) {
      .t1, .t2, .t3, .t4, .t5 { animation: none; width: 600px; }
      .cursor { animation: none; opacity: 1; }
      .glow { animation: none; }
    }
  </style>

  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="c1"><rect class="t1" x="52" y="74" width="0" height="26"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="52" y="112" width="0" height="48"/></clipPath>
    <clipPath id="c3"><rect class="t3" x="52" y="168" width="0" height="32"/></clipPath>
    <clipPath id="c4"><rect class="t4" x="52" y="214" width="0" height="26"/></clipPath>
    <clipPath id="c5"><rect class="t5" x="52" y="252" width="0" height="26"/></clipPath>
  </defs>

  <!-- page background -->
  <rect width="1000" height="330" fill="#F1E8D6"/>

  <!-- hard retro shadow + window -->
  <rect x="38" y="32" width="940" height="278" fill="#2F4BFF"/>
  <rect x="30" y="24" width="940" height="278" fill="#F1E8D6" stroke="#1B1B1B" stroke-width="3"/>

  <!-- title bar -->
  <rect x="30" y="24" width="940" height="34" fill="#1B1B1B"/>
  <text x="48" y="47" class="mono" font-size="16" fill="#F1E8D6">BILAL-OS v1.0</text>
  <rect x="890" y="33" width="16" height="16" fill="none" stroke="#F1E8D6" stroke-width="2"/>
  <rect x="914" y="33" width="16" height="16" fill="none" stroke="#F1E8D6" stroke-width="2"/>
  <rect x="938" y="33" width="16" height="16" fill="#FFB020"/>

  <!-- screen -->
  <rect x="30" y="58" width="940" height="244" fill="#0E1410"/>

  <!-- typed lines -->
  <g class="mono">
    <text x="52" y="94" font-size="18" fill="#4DFF9A" opacity="0.7" clip-path="url(#c1)">&gt; booting BILAL-OS v1.0 .......... [ OK ]</text>
    <text x="52" y="152" font-size="40" fill="#F1E8D6" clip-path="url(#c2)">MUHAMMAD BILAL KHALID</text>
    <text x="52" y="192" font-size="24" fill="#FFB020" clip-path="url(#c3)">AI Application Developer</text>
    <text x="52" y="234" font-size="18" fill="#4DFF9A" clip-path="url(#c4)">&gt; AI apps | automation | web projects</text>
    <text x="52" y="272" font-size="18" fill="#4DFF9A" clip-path="url(#c5)">&gt; status: open to internships &amp; freelance</text>
    <rect class="cursor" x="506" y="257" width="11" height="20" fill="#4DFF9A"/>
  </g>

  <!-- scanlines + subtle CRT flicker -->
  <rect x="30" y="58" width="940" height="244" fill="url(#scan)" pointer-events="none"/>
  <rect class="glow" x="30" y="58" width="940" height="244" fill="#4DFF9A" opacity="0.05" pointer-events="none"/>
</svg>
