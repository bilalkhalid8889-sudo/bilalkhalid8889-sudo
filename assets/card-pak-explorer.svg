<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-label="Tourism platform with tour guides, booking, dynamic pricing and an AI travel assistant. Live client project." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pak-Explorer</title>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .boot { transform-box: fill-box; transform-origin: center; animation: on 0.5s steps(5) 0.3s both; }
    .light { animation: blink 1.6s steps(1) 0.8s infinite; }
    @keyframes on {
      0% { opacity: 0; transform: scaleY(0.02); }
      40% { opacity: 1; transform: scaleY(0.02); }
      100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.15; } }
    @media (prefers-reduced-motion: reduce) {
      .boot, .light { animation: none; }
    }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.28"/></pattern>
  </defs>
  <rect width="480" height="240" fill="#F1E8D6"/>
  <rect x="22" y="22" width="450" height="206" fill="#2F4BFF"/>
  <rect x="14" y="14" width="450" height="206" fill="#F1E8D6" stroke="#1B1B1B" stroke-width="3"/>
  <rect x="14" y="14" width="450" height="30" fill="#1B1B1B"/>
  <text x="28" y="35" class="mono" font-size="14" fill="#F1E8D6">pak-explorer.exe</text>
  <rect x="438" y="22" width="14" height="14" fill="#FFB020"/>
  <rect x="14" y="44" width="450" height="176" fill="#0E1410"/>
  <g class="boot">
    <g class="mono">
      <text x="34" y="86" font-size="26" fill="#FFB020">Pak-Explorer</text>
      <text x="34" y="118" font-size="15" fill="#F1E8D6">Tourism platform with tour guides, booking,</text>
      <text x="34" y="140" font-size="15" fill="#F1E8D6">dynamic pricing and an AI travel assistant.</text>
      <text x="34" y="174" font-size="14" fill="#4DFF9A" opacity="0.7">Leaflet.js, Groq API, Supabase</text>
      <text x="54" y="202" font-size="14" fill="#4DFF9A">[ live ]</text>
    </g>
    <rect class="light" x="34" y="192" width="10" height="10" fill="#4DFF9A"/>
  </g>
  <rect x="14" y="44" width="450" height="176" fill="url(#scan)" pointer-events="none"/>
</svg>
