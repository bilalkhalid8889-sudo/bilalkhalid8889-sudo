<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="System info. Role: AI Application Developer. Experience: 8 months, client work. Location: Lahore, Pakistan. Open to: internships and freelance." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>System info</title>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
  </style>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="#F1E8D6"/>

  <!-- hard retro shadow + window -->
  <rect x="38" y="32" width="940" height="192" fill="#2F4BFF"/>
  <rect x="30" y="24" width="940" height="192" fill="#F1E8D6" stroke="#1B1B1B" stroke-width="3"/>

  <!-- title bar -->
  <rect x="30" y="24" width="940" height="34" fill="#1B1B1B"/>
  <text x="48" y="47" class="mono" font-size="16" fill="#F1E8D6">SYSTEM.INFO</text>
  <rect x="890" y="33" width="16" height="16" fill="none" stroke="#F1E8D6" stroke-width="2"/>
  <rect x="914" y="33" width="16" height="16" fill="none" stroke="#F1E8D6" stroke-width="2"/>
  <rect x="938" y="33" width="16" height="16" fill="#FFB020"/>

  <!-- screen -->
  <rect x="30" y="58" width="940" height="158" fill="#0E1410"/>

  <g class="mono" font-size="20">
    <text x="52" y="96" fill="#4DFF9A" opacity="0.7">role</text>
    <text x="232" y="96" fill="#F1E8D6">AI Application Developer</text>

    <text x="52" y="128" fill="#4DFF9A" opacity="0.7">experience</text>
    <text x="232" y="128" fill="#F1E8D6">8 months, client work</text>

    <text x="52" y="160" fill="#4DFF9A" opacity="0.7">location</text>
    <text x="232" y="160" fill="#F1E8D6">Lahore, Pakistan</text>

    <text x="52" y="192" fill="#4DFF9A" opacity="0.7">open_to</text>
    <text x="232" y="192" fill="#FFB020">Internships &amp; freelance</text>
  </g>

  <rect x="30" y="58" width="940" height="158" fill="url(#scan)" pointer-events="none"/>
</svg>
