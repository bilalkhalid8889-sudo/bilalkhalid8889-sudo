<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="224" viewBox="0 0 1000 224" role="img" aria-label="What I build. AI apps: Groq and Gemini APIs, PDF to quizzes and notes, chat assistants. Automation: daily briefing email, desktop AI agent, agents with memory. Web projects: booking and dashboards, maps and live weather, Supabase accounts." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
